<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI回答显示调试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .test-section {
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    
    button:hover {
      background: #45a049;
    }
    
    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
    
    .messages {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .message {
      margin: 10px 0;
      padding: 12px;
      border-radius: 10px;
      animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .user-message {
      background: rgba(33, 150, 243, 0.3);
      margin-left: 50px;
    }
    
    .ai-message {
      background: rgba(76, 175, 80, 0.3);
      margin-right: 50px;
    }
    
    .thinking {
      background: rgba(255, 152, 0, 0.3);
      text-align: center;
      font-style: italic;
    }
    
    .log {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .log-entry {
      margin: 2px 0;
      padding: 2px;
    }
    
    .log-info { color: #4CAF50; }
    .log-error { color: #f44336; }
    .log-warn { color: #ff9800; }
    
    input {
      width: calc(100% - 120px);
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 AI回答显示调试工具</h1>
    
    <div class="test-section">
      <h3>📝 模拟测试</h3>
      <div>
        <input type="text" id="userInput" placeholder="输入用户消息..." value="What's your favorite book?">
        <button onclick="simulateUserSpeech()">发送消息</button>
      </div>
      <div style="margin-top: 10px;">
        <button onclick="simulateAIThinking()">模拟AI思考</button>
        <button onclick="simulateAIResponse()">模拟AI回答</button>
        <button onclick="clearMessages()">清空消息</button>
      </div>
    </div>
    
    <div class="test-section">
      <h3>💬 对话记录</h3>
      <div id="messages" class="messages"></div>
    </div>
    
    <div class="test-section">
      <h3>📊 状态信息</h3>
      <div>
        <strong>思考状态：</strong> <span id="thinkingState">待命</span><br>
        <strong>说话状态：</strong> <span id="speakingState">待命</span><br>
        <strong>消息数量：</strong> <span id="messageCount">0</span>
      </div>
    </div>
    
    <div class="test-section">
      <h3>📝 调试日志</h3>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    // 模拟消息存储
    let messages = [];
    let isThinking = false;
    let isSpeaking = false;

    // 日志函数
    function addLog(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // 更新状态显示
    function updateStatus() {
      document.getElementById('thinkingState').textContent = isThinking ? '思考中...' : '待命';
      document.getElementById('speakingState').textContent = isSpeaking ? '说话中...' : '待命';
      document.getElementById('messageCount').textContent = messages.length;
    }

    // 显示消息
    function displayMessages() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      
      messages.forEach((msg, index) => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.isUser ? 'user-message' : 'ai-message'}`;
        msgDiv.innerHTML = `
          <strong>${msg.isUser ? '👤 您' : '🤖 AI助手'}:</strong><br>
          ${msg.text}
          <div style="font-size: 11px; opacity: 0.7; margin-top: 5px;">
            ${new Date(msg.timestamp).toLocaleTimeString()}
          </div>
        `;
        messagesDiv.appendChild(msgDiv);
      });
      
      // 显示思考状态
      if (isThinking) {
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message thinking';
        thinkingDiv.textContent = '🧠 AI正在思考...';
        messagesDiv.appendChild(thinkingDiv);
      }
      
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      addLog(`显示了 ${messages.length} 条消息`, 'info');
    }

    // 添加消息
    function addMessage(text, isUser = false) {
      const message = {
        text: text,
        isUser: isUser,
        timestamp: Date.now()
      };
      messages.push(message);
      addLog(`添加${isUser ? '用户' : 'AI'}消息: ${text.substring(0, 30)}...`, 'info');
      displayMessages();
      updateStatus();
    }

    // 模拟用户说话
    function simulateUserSpeech() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      
      if (!text) {
        addLog('用户消息为空', 'warn');
        return;
      }
      
      addLog('用户发送消息', 'info');
      addMessage(text, true);
      
      // 自动触发AI回复
      setTimeout(() => {
        simulateAIThinking();
        setTimeout(() => {
          simulateAIResponse();
        }, 2000);
      }, 500);
    }

    // 模拟AI思考
    function simulateAIThinking() {
      isThinking = true;
      updateStatus();
      displayMessages();
      addLog('AI开始思考', 'info');
    }

    // 模拟AI回答
    function simulateAIResponse() {
      isThinking = false;
      isSpeaking = true;
      updateStatus();
      
      const responses = [
        "That's a very interesting perspective. Could you tell me more about your experience with this?",
        "I understand your point. Have you considered the alternative viewpoint?",
        "That's a great example. How do you think this applies in different situations?",
        "Very thoughtful response. What do you think are the main challenges in this area?",
        "I see what you mean. How has this changed over the years in your opinion?"
      ];
      
      const response = responses[Math.floor(Math.random() * responses.length)];
      
      addLog('AI生成回复', 'info');
      addMessage(response, false);
      
      setTimeout(() => {
        isSpeaking = false;
        updateStatus();
        addLog('AI说话完成', 'info');
      }, 3000);
    }

    // 清空消息
    function clearMessages() {
      messages = [];
      isThinking = false;
      isSpeaking = false;
      displayMessages();
      updateStatus();
      addLog('清空所有消息', 'warn');
    }

    // 初始化
    addLog('调试工具初始化完成', 'info');
    updateStatus();
    
    // 按回车发送
    document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        simulateUserSpeech();
      }
    });
  </script>
</body>
</html>
