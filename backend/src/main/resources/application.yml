server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/deeptalk?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  redis:
    host: localhost        # Redis服务器地址
    port: 6379            # Redis服务器端口
    password:             # Redis密码（如果没有设置密码则留空）
    database: 0           # 使用的数据库索引（0-15）
    timeout: 5000         # 连接超时时间（毫秒）
    lettuce:
      pool:
        max-active: 8     # 连接池最大连接数
        max-idle: 8       # 连接池最大空闲连接数
        min-idle: 0       # 连接池最小空闲连接数
        max-wait: -1      # 连接池最大阻塞等待时间（-1表示没有限制）
  
  http:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update  # 自动创建/更新表结构
    show-sql: true      # 显示SQL语句（便于调试）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        connection:
          characterEncoding: UTF-8
        jdbc:
          useUnicode: true
          characterEncoding: UTF-8
  mail:
    host: smtp.qq.com
    port: 587
    username: 1602113776@qq.com  # 替换为您的QQ邮箱
    password: jhxxemecrsgjhhca    # 替换为您的QQ邮箱授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  expiration:
    normal: 86400000  # 24小时
    remember-me: 2592000000  # 30天

kurento:
  client:
    kms:
      ws:
        uri: ws://127.0.0.1:8888/kurento

